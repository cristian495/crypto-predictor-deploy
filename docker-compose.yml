# predictor — stack de señales (paper trading) + UI web.
# Metodologia calcada de boolend-deploy: aislamiento por COMPOSE_PROJECT_NAME,
# config propia en .env, nginx en el HOST (la web se publica solo en 127.0.0.1).
#
# web:    sirve la UI + los JSON del volumen. Corre 24/7 (`docker compose up -d`).
# worker: EFÍMERO. NO arranca con `up` (profile "manual"). Lo lanza el cron del VPS:
#           docker compose run --rm worker scan      (cada hora)
#           docker compose run --rm worker resolve    (cada 6h)
#           docker compose run --rm worker export     (1x/dia)
#         Hace su tarea y se apaga. El horario vive en el cron del VPS (ver COMMANDS.md).
#
# Aislamiento por entorno: el volumen `signaldata` -> `predictor_<env>_signaldata`.
name: ${COMPOSE_PROJECT_NAME}

services:
  worker:
    build: ./worker
    profiles: ["manual"]              # no arranca con `up`; solo con `run --rm worker <tarea>`
    environment:
      # Solo lo que VARÍA por entorno. ENGINE_DIR/DATA_DIR ya son ENV del Dockerfile.
      TZ: ${TZ:-UTC}
      # Secreto del .env de ESTA carpeta (gitignored). Si falta, el worker registra pero no alerta.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./repos/engine:/engine:ro     # el CODIGO del engine, READ-ONLY
      - signaldata:/data              # log de señales + JSON de la UI (persistente)

  web:
    build: ./repos/ui                 # Dockerfile self-contained de la UI
    restart: unless-stopped
    volumes:
      # El MISMO volumen del worker, READ-ONLY donde nginx sirve /data (JSON frescos).
      - signaldata:/usr/share/nginx/html/data:ro
    ports:
      - "127.0.0.1:${WEB_PORT}:80"    # el Nginx del host -> aqui

volumes:
  signaldata:
