# EJEMPLO — copia este archivo a ssl-<TU_DOMINIO>.conf y ajusta las rutas.
# Cada DOMINIO = su propia zona Cloudflare = su propio Origin Certificate = su propio snippet.
# El Origin cert (15 años) se instala en /etc/ssl/cloudflare/<dominio>/ (ver docs/setup-vps.md).
# host-level destino: /etc/nginx/snippets/ssl-example.com.conf
ssl_certificate     /etc/ssl/cloudflare/example.com/origin.pem;
ssl_certificate_key /etc/ssl/cloudflare/example.com/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
